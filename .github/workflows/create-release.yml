name: Create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Clean Go build cache
        run: |
          go clean -cache -modcache -testcache || true
          rm -rf ~/.cache/go-build || true
          rm -rf $(go env GOCACHE) || true
          rm -rf $(go env GOMODCACHE) || true

      - name: Disk Space Cleanup
        run: |
          # 1. Delete large pre-installed packages (frees ~10-12 GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm

          # 2. Clean apt cache (frees ~200 MB)
          sudo apt-get clean

          # 3. Remove docker images (frees ~3 GB)
          docker system prune -a -f

          # 4. Check space
          df -h

      - name: Make release
        run: |
          sudo rm -rf dist
          make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}